kind: Added
body: |-
    Added scoped table access with repair and access options.

    Use `with_table_with` in `slate/set`, `slate/bag`, or
    `slate/duplicate_bag` to select a repair policy and access mode while
    retaining `with_table` cleanup and error handling.
