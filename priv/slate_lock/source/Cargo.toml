[package]
name = "slate_lock"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rustler = { version = "0.38", features = ["nif_version_2_17"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_WindowsProgramming",
] }
