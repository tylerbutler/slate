name: "Setup Gleam Environment"
description: "Common setup steps for Gleam CI jobs"

runs:
  using: "composite"
  steps:
    - name: Setup tools
      uses: ./.github/actions/setup-mise

    - name: Cache Gleam dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # ratchet:actions/cache@v4
      with:
        path: |
          build/packages
          ~/.cache/gleam
        key: gleam-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gleam.toml', 'manifest.toml') }}
        restore-keys: |
          gleam-${{ runner.os }}-${{ runner.arch }}-

    - name: Download dependencies
      shell: bash
      run: just deps
