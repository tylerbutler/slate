name: "Setup Gleam Environment"
description: "Common setup steps for Gleam CI jobs"

runs:
  using: "composite"
  steps:
    - name: Setup tools
      uses: ./.github/actions/setup-mise

    - name: Cache Gleam dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6
      with:
        path: |
          build/packages
          ~/.cache/gleam
        key: gleam-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gleam.toml', 'manifest.toml') }}
        restore-keys: |
          gleam-${{ runner.os }}-${{ runner.arch }}-

    - name: Download dependencies
      shell: bash
      run: just deps
