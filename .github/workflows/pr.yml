name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  pull-requests: write

jobs:
  # PR title conventional commit validation
  title:
    name: PR Title
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # ratchet:actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install commitlint
        run: npm install --save-dev @commitlint/cli @commitlint/config-conventional

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint

  # Changelog entry check
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    # A release PR consumes fragments; it must not need a new one.
    if: >-
      github.event.pull_request.draft != true &&
      github.event.action != 'edited' &&
      !(github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'release/next')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Trellis
        uses: ./.github/actions/setup-trellis

      - name: Check changelog
        id: changelog
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Keep the existing advisory policy for user-facing commit types.
          subjects="$(git log --format=%s "$BASE_SHA..$HEAD_SHA")"
          if grep -Eq '^(feat|fix|refactor|security)(\([^)]*\))?!?:|^[[:alpha:]]+(\([^)]*\))?!:' <<< "$subjects"; then
            echo "comment_missing=true" >> "$GITHUB_OUTPUT"
          else
            echo "comment_missing=false" >> "$GITHUB_OUTPUT"
          fi
          trellis changelog check --base "$BASE_SHA" --head "$HEAD_SHA" \
            --format github >> "$GITHUB_OUTPUT"

      - name: Comment with changelog preview
        if: >-
          steps.changelog.outputs.has_entries == 'true' ||
          (steps.changelog.outputs.comment_missing == 'true' &&
           steps.changelog.outputs.needs_entry == 'true') ||
          steps.changelog.outputs.invalid_fragments != '[]'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # ratchet:marocchino/sticky-pull-request-comment@v2
        with:
          header: changelog
          message: ${{ steps.changelog.outputs.preview }}

      - name: Remove changelog comment
        if: >-
          steps.changelog.outputs.has_entries == 'false' &&
          (steps.changelog.outputs.comment_missing == 'false' ||
           steps.changelog.outputs.needs_entry == 'false') &&
          steps.changelog.outputs.invalid_fragments == '[]'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # ratchet:marocchino/sticky-pull-request-comment@v2
        with:
          header: changelog
          delete: true

      - name: Fail if the changelog check failed
        if: steps.changelog.outputs.ok != 'true'
        run: exit 1
