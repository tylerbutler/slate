name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Collect same-revision native artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # ratchet:actions/download-artifact@v4
        with:
          pattern: slate-native-*
          path: build/release-native

      - name: Assemble complete native package
        shell: bash
        run: |
          for target in x86_64-linux-gnu aarch64-linux-gnu x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows; do
            mkdir -p "priv/slate_lock/$target"
            cp "build/release-native/slate-native-$target/"slate_lock.* "priv/slate_lock/$target/"
          done
          just native-release-check
          just native-package-check

      - name: Create GitHub Release
        run: trellis tag create --github-release
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish to Hex.pm
        run: trellis publish --tag "$GITHUB_REF_NAME"
        env:
          HEXPM_API_KEY: ${{ secrets.HEXPM_API_KEY }}
