[build]
  command = "pnpm build:site"
  publish = "dist"
  # Only trigger builds when files in website/ changed since this branch
  # diverged from main. Avoids relying on $CACHED_COMMIT_REF, which can end
  # up equal to $COMMIT_REF on deploy previews and cause a false "no changes".
  ignore = "git diff --quiet $(git merge-base origin/main HEAD) HEAD -- website/"

# Always build production deploys from main.
[context.production]
  ignore = "/bin/false"
